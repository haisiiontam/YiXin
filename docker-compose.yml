services:
  gomoku:
    build:
      context: .
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    image: gomoku-channel-lab:local
    container_name: gomoku-channel-lab
    ports:
      - "4173:4173"
    environment:
      PORT: "4173"
      HOST: "0.0.0.0"
      CHALLENGE_PERIOD: "60"
      # 如果从别的域名访问，把它加进来（逗号分隔），否则会被来源校验拦下
      EXTRA_ORIGINS: ""
    volumes:
      # 链数据、合约地址、房间记录持久化；换机器删掉这个目录即可全新开局
      - ./artifacts/runtime:/app/artifacts/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 3s
      start_period: 40s
      retries: 3
